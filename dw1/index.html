<script>
window.CFG = {
  // Link de checkout one-click da Lastlink para o DOWNSELL 1

  // Para onde vai o "não, obrigado" → DOWNSELL 2

<style>
:root{
  --bg:#FAF7F2;
  --ink:#2E1B33;
  --ink-soft:#6B5A70;
  --gold:#C9A24A;
  --gold-dark:#A9842F;
  --ok:#0F7A52;
  --line:#E6DED2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;
  padding:24px 16px 56px;
  display:flex;
  justify-content:center;
}
.wrap{width:100%;max-width:440px}

/* ---- topo / confirmação ---- */
.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:#FBF1DA;color:var(--gold-dark);
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:7px 13px;border-radius:999px;
}
.chip svg{width:13px;height:13px;flex:none}

.steps{
  display:flex;gap:10px;margin:16px 0 20px;
  font-size:12px;color:var(--ink-soft);
}
.step{display:flex;align-items:center;gap:6px;flex:1}
.step b{
  width:19px;height:19px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;
}
.step.done b{background:var(--ok);color:#fff}
.step.now b{background:var(--ink);color:#fff}
.step.now{color:var(--ink);font-weight:600}
.step i{display:block;height:2px;background:var(--line);border-radius:2px;margin-top:7px}

/* ---- headline ---- */
h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(29px,8.2vw,38px);
  line-height:1.14;
  letter-spacing:-.015em;
  font-weight:700;
  margin-bottom:4px;
}
h1 em{font-style:normal;color:var(--gold-dark)}
.hook{
  margin:13px 0 18px;
  font-size:clamp(16px,4.4vw,18.5px);
  font-weight:800;letter-spacing:.035em;
  color:var(--gold-dark);
  display:flex;align-items:center;gap:9px;
}
.hook svg{
  width:18px;height:18px;fill:currentColor;flex:none;
  animation:bob 1.7s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.hook svg{animation:none}}

/* ---- player ---- */
.player{margin:0 auto}

/* ---- revelação ---- */
/* ------------------------------------------------------------------
   O VTURB REVELA ESTE BLOCO.
   No painel do player: Tipo de botão → "Mostrar conteúdo oculto"
   → informar a classe ou o ID:  pitch
   Deixe o display:none simples. Nada de !important: o VTurb precisa
   conseguir sobrescrever esta regra.
   ------------------------------------------------------------------ */
#pitch{display:none;margin-top:26px;animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cta{
  display:block;width:100%;
  background:var(--gold);color:#2A1A10;
  border:0;border-radius:12px;
  padding:18px 20px;
  font-size:17px;font-weight:800;letter-spacing:.01em;
  text-align:center;text-decoration:none;
  box-shadow:0 4px 0 var(--gold-dark);
  cursor:pointer;
}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark)}

.no-thanks{
  display:block;text-align:center;
  margin-top:24px;
  font-size:14.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink);
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;
  text-decoration-color:#C3B6C6;
}
.no-thanks:hover{text-decoration-color:var(--ink)}

.legal{
  margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  font-size:11px;color:#9A8E9E;text-align:center;line-height:1.6;
}
</style>
</head>
<body>
<div class="wrap">

  <span class="chip">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5 15 14H1zM7.2 5.8v4h1.6v-4zm0 5.2v1.6h1.6V11z"/></svg>
    Última chance
  </span>

  <h1>Eu não vou insistir.<br>Vou <em>tirar o preço</em> do caminho.</h1>

  <p class="hook">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.6 2.4 7l1.3-1.3L8 10l4.3-4.3L13.6 7z"/></svg>
    ASSISTA PRA DESCOBRIR COMO!
  </p>

  <div class="player">
    <vturb-smartplayer id="vid-6aedd2d9947cb141a38f343d" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 177.77777777777777% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
    <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/39bacfbb-fef1-4b83-a079-e348cc953582/players/6aedd2d9947cb141a38f343d/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
  </div>

  <div id="pitch" class="pitch">
    <a class="cta" id="cta" href="#">SIM, QUERO ENTRAR POR ESSE CAMINHO</a>
  </div>

  <!-- fora do #pitch de propósito: no downsell a recusa fica visível
       desde o primeiro segundo -->
  <a class="no-thanks" id="noThanks" href="#">Não, obrigado</a>

  <p class="legal">
    Pagamento único. Acesso imediato na área de membros.<br>
    Catorze dias de garantia — se não servir pra você, devolvemos.
  </p>

</div>

<script>
(function(){
  var C=window.CFG||{};
  var cta=document.getElementById('cta');
  var nt=document.getElementById('noThanks');
  var pitch=document.getElementById('pitch');

  cta.href=C.CHECKOUT_URL||'#';
  nt.href=C.NO_THANKS_URL||'#';

  function dl(ev){(window.dataLayer=window.dataLayer||[]).push({event:ev,pagina:'downsell_1'});}
  cta.addEventListener('click',function(){dl('cta_clique');});
  nt.addEventListener('click',function(){dl('recusa_clique');});

  /* Avisa o GTM no instante em que o VTurb revela o bloco. */
  var olho=setInterval(function(){
    if(getComputedStyle(pitch).display!=='none'){clearInterval(olho);dl('pitch_revelado');}
  },400);

  function temVideo(raiz){
    raiz=raiz||document;
    try{
      if(raiz.querySelector('video'))return true;
      var t=raiz.querySelectorAll('*');
      for(var i=0;i<t.length;i++){
        if(t[i].shadowRoot&&temVideo(t[i].shadowRoot))return true;
      }
    }catch(e){}
    return false;
  }

  /* Rede de segurança — a única coisa que a página decide sozinha.
     Se depois de 25 s não existe nenhum <video> na tela, o player não
     carregou. Sem player não há vídeo pra assistir nem botão pra clicar,
     e a pessoa fica presa. Então libera. */
  setTimeout(function(){
    if(temVideo())return;
    pitch.style.display='block';
    dl('player_nao_carregou');
  },25000);
})();
</script>
</body>
