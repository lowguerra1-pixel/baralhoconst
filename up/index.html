<style>
:root{
  --bg:#FAF7F2;
  --ink:#2E1B33;
  --ink-soft:#6B5A70;
  --gold:#C9A24A;
  --gold-dark:#A9842F;
  --ok:#0F7A52;
  --line:#E6DED2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;
}
.wrap{width:100%;max-width:440px;margin:0 auto;padding:26px 16px 56px}

/* ---- barra de progresso no topo ---- */
.topbar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:11px 16px;
  position:sticky;top:0;z-index:10;
}
.topbar-in{
  max-width:440px;margin:0 auto;
  display:flex;align-items:center;gap:11px;
  font-size:12.5px;
}
.tb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb.done{color:var(--ok);font-weight:600}
.tb.done svg{width:15px;height:15px;fill:currentColor;flex:none}
.tb.now{color:var(--ink);font-weight:700}
.tb.now b{
  width:18px;height:18px;border-radius:50%;flex:none;
  background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:10.5px;font-weight:800;
}
.tb-sep{flex:1;height:2px;background:var(--line);border-radius:2px;min-width:14px}

/* ---- topo / confirmação ---- */
/* ---- headline ---- */
h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(28px,7.8vw,36px);
  line-height:1.16;
  letter-spacing:-.012em;
  font-weight:700;
  margin-bottom:4px;
}
h1 em{font-style:normal;color:var(--gold-dark)}
.hook{
  margin:13px 0 18px;
  font-size:clamp(16px,4.4vw,18.5px);
  font-weight:800;letter-spacing:.035em;
  color:var(--gold-dark);
  display:flex;align-items:center;gap:9px;
}
.hook svg{
  width:18px;height:18px;fill:currentColor;flex:none;
  animation:bob 1.7s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.hook svg{animation:none}}

/* ---- player ---- */
.player{margin:0 auto}

/* ---- revelação ---- */
/* ------------------------------------------------------------------
   O VTURB REVELA ESTE BLOCO.
   No painel do player: Tipo de botão → "Mostrar conteúdo oculto"
   → informar a classe ou o ID:  pitch
   Deixe o display:none simples. Nada de !important: o VTurb precisa
   conseguir sobrescrever esta regra.
   ------------------------------------------------------------------ */
#pitch{display:none;margin-top:26px;animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cta{
  display:block;width:100%;
  background:var(--gold);color:#2A1A10;
  border:0;border-radius:12px;
  padding:18px 20px;
  font-size:17px;font-weight:800;letter-spacing:.01em;
  text-align:center;text-decoration:none;
  box-shadow:0 4px 0 var(--gold-dark);
  cursor:pointer;
}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark)}

.no-thanks{
  display:block;text-align:center;
  margin-top:24px;
  font-size:14.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink);
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;
  text-decoration-color:#C3B6C6;
}
.no-thanks:hover{text-decoration-color:var(--ink)}

.legal{
  margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  font-size:11px;color:#9A8E9E;text-align:center;line-height:1.6;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <span class="tb done">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zM6.9 11.6 3.6 8.3l1.2-1.2 2.1 2.1 4.3-4.3 1.2 1.2z"/></svg>
      Baralho liberado
    </span>
    <span class="tb-sep"></span>
    <span class="tb now"><b>2</b>Último passo</span>
  </div>
</div>

<div class="wrap">

  <h1>Calma — o seu baralho <em>impresso</em> ainda pode ser seu.</h1>

  <p class="hook">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.6 2.4 7l1.3-1.3L8 10l4.3-4.3L13.6 7z"/></svg>
    ASSISTA PRA DESCOBRIR COMO!
  </p>

  <div class="player">
    <vturb-smartplayer id="vid-6aec90bbcbbb1f15a849a5a1" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 177.77777777777777% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
    <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/39bacfbb-fef1-4b83-a079-e348cc953582/players/6aec90bbcbbb1f15a849a5a1/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
  </div>

  <div id="pitch" class="pitch">
    <a class="cta" id="cta" href="#">SIM, QUERO O MÉTODO COMPLETO</a>
    <a class="no-thanks" id="noThanks" href="#">Não, obrigado</a>
  </div>

  <p class="legal">
    Pagamento único. Acesso imediato na área de membros.<br>
    Catorze dias de garantia — se não servir pra você, devolvemos.
  </p>

</div>

<script>
(function(){
  var C=window.CFG||{};
  var cta=document.getElementById('cta');
  var nt=document.getElementById('noThanks');
  var pitch=document.getElementById('pitch');

  cta.href=C.CHECKOUT_URL||'#';
  nt.href=C.NO_THANKS_URL||'#';

  function dl(ev){(window.dataLayer=window.dataLayer||[]).push({event:ev,pagina:'upsell_1'});}
  cta.addEventListener('click',function(){dl('cta_clique');});
  nt.addEventListener('click',function(){dl('recusa_clique');});

  /* Avisa o GTM no instante em que o VTurb revela o bloco. */
  var olho=setInterval(function(){
    if(getComputedStyle(pitch).display!=='none'){clearInterval(olho);dl('pitch_revelado');}
  },400);

  function temVideo(raiz){
    raiz=raiz||document;
    try{
      if(raiz.querySelector('video'))return true;
      var t=raiz.querySelectorAll('*');
      for(var i=0;i<t.length;i++){
        if(t[i].shadowRoot&&temVideo(t[i].shadowRoot))return true;
      }
    }catch(e){}
    return false;
  }

  /* Rede de segurança — a única coisa que a página decide sozinha.
     Se depois de 25 s não existe nenhum <video> na tela, o player não
     carregou. Sem player não há vídeo pra assistir nem botão pra clicar,
     e a pessoa fica presa. Então libera. */
  setTimeout(function(){
    if(temVideo())return;
    pitch.style.display='block';
    dl('player_nao_carregou');
  },25000);
})();
</script>
